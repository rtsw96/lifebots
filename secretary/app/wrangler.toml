# Cloudflare Worker for the Secretary app (the secretary bot's Mini App). deploy.sh
# fills in the KV id and the secrets (BOT_TOKEN, OWNER_ID, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET); nothing secret here.
name = "secretary-app"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = true

# The page, scripts, styles and fonts. The Worker runs first so every response
# gets the security headers.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Google tokens, the cached calendar (titles and times only), the sleep and
# workout summaries and claims pushed from the repo, and receipt images.
[[kv_namespaces]]
binding = "TIME"
id = "KV_NAMESPACE_ID"

# No request logs: initData and calendar data never reach a log.
[observability]
enabled = false
