<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f4a45">
<title>Money</title>
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-sc-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js" type="module"></script>
</head>
<body>
<header class="top">
  <span class="logo" aria-hidden="true"><span data-icon="mark" class="icon"></span></span>
  <div class="ident">
    <h1>Money</h1>
    <p id="sub" class="sub"></p>
  </div>
  <span id="pending" class="pending" hidden></span>
  <button type="button" id="demo-badge" class="pending demo-badge" hidden aria-label="Demo mode: enter the PIN to leave">Demo</button>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sections" hidden>
  <button type="button" role="tab" data-tab="overview" aria-controls="view">Overview</button>
  <button type="button" role="tab" data-tab="day" aria-controls="view">Everyday</button>
  <button type="button" role="tab" data-tab="flows" aria-controls="view">Flows</button>
  <button type="button" role="tab" data-tab="recurring" aria-controls="view">Recurring</button>
  <button type="button" role="tab" data-tab="spending" aria-controls="view">Spending</button>
  <button type="button" role="tab" data-tab="holdings" aria-controls="view">Holdings</button>
</nav>
<main id="view" role="tabpanel"><p class="status" id="status">Loading…</p></main>
<footer id="foot" hidden>
  <p id="asof"></p>
  <p id="foot-note">Decrypted on this phone only: the server stores data it can't read. Not financial advice.</p>
  <p class="foot-btns">
    <button type="button" id="refresh" class="linkbtn">Refresh</button>
    <button type="button" id="demo-on" class="linkbtn" hidden>Demo mode</button>
  </p>
</footer>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-card">
    <button type="button" class="sheet-x" id="sheet-x" aria-label="Close"></button>
    <div id="sheet-body"></div>
  </div>
</div>
</body>
</html>
